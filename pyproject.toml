[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supplymodel"
version = "0.1.0"
description = "Representative-agent model of intermittent piped water supply with household storage"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "SALib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
